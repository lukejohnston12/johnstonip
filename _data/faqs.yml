# FAQ content. Answers support Markdown. Used on the homepage (first group, first 4) and /faqs/.
# General information only — not legal advice.
- group: Getting started
  items:
    - q: What happens in a free discovery session?
      a: >-
        We learn about your business, what you’re building and where you’re headed. Then we talk through what can
        be protected — brands, inventions, designs, content and know-how — what each option involves, and what to
        prioritize. There’s no cost and no obligation.
    - q: Do I need a trademark, a patent or a copyright?
      a: >-
        It depends on what you’re protecting. **Trademarks** protect brand identifiers like names, logos and slogans.
        **Patents** protect inventions (utility patents) and the ornamental look of products (design patents).
        **Copyrights** protect original creative works, including software code. Many businesses need more than one —
        take the one-minute IP Scan on our homepage, or ask us in a free discovery session.
    - q: Do you only work with clients in Texas?
      a: >-
        No. Trademarks and patents are federal rights handled by the U.S. Patent and Trademark Office, so we represent
        companies and individuals nationwide from our Dallas office, and we coordinate protection internationally when
        your business crosses borders.
    - q: Should I talk to you before I launch, pitch or raise money?
      a: >-
        Ideally, yes. Clearing a brand before you invest in it is far cheaper than rebranding later, and publicly
        disclosing an invention starts a clock on your patent rights — in many countries, disclosure before filing can
        forfeit protection entirely.
    - q: What should I bring to my first conversation?
      a: >-
        Whatever helps us understand what you’re building: the names or logos you use or plan to use, a description or
        sketches of your invention, where and when you’ve sold or shown it, and any agreements you have with
        co-founders, contractors or partners.

- group: Trademarks
  items:
    - q: What are the benefits of registering a trademark?
      a: >-
        A federal registration gives you the exclusive right to use your mark nationwide for the goods or services
        listed, a legal presumption that you own it, the right to use the ® symbol, and a foundation for enforcement
        and for protection in other countries.
    - q: What’s the difference between ™ and ®?
      a: >-
        You can use ™ with any mark you claim as a trademark, registered or not. The ® symbol may only be used once the
        mark is registered with the USPTO.
    - q: How long does trademark registration take?
      a: >-
        It varies with USPTO workloads and whether the examiner raises issues, but the process commonly takes a year or
        more from filing to registration. A clearance search up front reduces surprises along the way.
    - q: How long does a trademark registration last?
      a: >-
        As long as you keep using the mark and file the required maintenance documents — between the 5th and 6th years
        after registration, and renewals every 10 years.

- group: Patents
  items:
    - q: What types of patents are there?
      a: >-
        There are three: **utility patents** for new and useful processes, machines, articles of manufacture and
        compositions; **design patents** for new, original ornamental designs; and **plant patents** for new varieties
        of asexually reproduced plants.
    - q: How long does a patent last?
      a: >-
        A utility patent generally lasts 20 years from its filing date, subject to maintenance fees. A design patent
        lasts 15 years from the date it’s granted.
    - q: What is a provisional patent application?
      a: >-
        A lower-cost filing that secures an early filing date and lets you use “patent pending.” It isn’t examined and
        expires after 12 months, so a non-provisional application must be filed within that year to keep the benefit.
    - q: Can software be patented?
      a: >-
        Sometimes. Abstract ideas aren’t patentable on their own, but specific technical solutions implemented in
        software often are. The code itself is also protected by copyright, and some aspects may be best kept as trade
        secrets.

- group: Copyrights & trade secrets
  items:
    - q: Do I need to register a copyright?
      a: >-
        Copyright exists as soon as an original work is fixed in a tangible form. But for U.S. works, registration is
        generally required before you can sue for infringement, and registering promptly can make statutory damages and
        attorney’s fees available.
    - q: What is a trade secret?
      a: >-
        Valuable business information — a formula, process, method, customer list or know-how — that isn’t generally
        known and that you take reasonable steps to keep confidential. Unlike patents, trade secrets don’t expire, but
        protection depends on keeping them secret.
